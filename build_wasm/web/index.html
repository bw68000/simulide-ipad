<!doctype html>
<!--
  SimulIDE web build (Qt for WebAssembly).
  SimulIDE is free software under the AGPLv3: source code in this repository.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SimulIDE">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-256.png">
  <link rel="manifest" href="manifest.json">
  <title>SimulIDE</title>
  <style>
    html, body { padding: 0; margin: 0; overflow: hidden; height: 100%; background: #fff;
                 -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
                 touch-action: none; overscroll-behavior: none; }
    #screen { width: 100%; height: 100%; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column;
               align-items: center; justify-content: center; gap: 14px;
               font: 16px -apple-system, system-ui, sans-serif; color: #333; }
    #loading img { width: 96px; height: 96px; }
    #bar { width: 220px; height: 6px; background: #e4e4e4; border-radius: 3px; overflow: hidden; }
    #bar > div { width: 30%; height: 100%; background: #3a7bd5; border-radius: 3px;
                 animation: slide 1.2s ease-in-out infinite; }
    @keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
    #status { font-size: 13px; color: #777; max-width: 80vw; text-align: center; }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icon-256.png" alt="">
    <strong>SimulIDE</strong>
    <div id="bar"><div></div></div>
    <div id="status">Loading (about 10 MB, first time only)…</div>
  </div>
  <div id="screen" style="display:none"></div>

  <script src="simulide.js"></script>
  <script src="qtloader.js"></script>
  <script>
    // Keep user files (settings, installed components, saved circuits)
    // in the browser's IndexedDB storage.
    function mountStorage(Module) {
      const FS = Module.FS;
      const IDBFS = FS.filesystems && FS.filesystems.IDBFS;
      if (!IDBFS) return;
      try { FS.mkdirTree('/home/web_user'); } catch (e) {}
      FS.mount(IDBFS, {}, '/home/web_user');
      Module.addRunDependency('simulide-storage');
      FS.syncfs(true, function (err) {
        if (err) console.log('SimulIDE: could not load saved data', err);
        Module.simulidePersist = true;
        Module.removeRunDependency('simulide-storage');
      });
      const save = () => { if (Module.simulidePersist) FS.syncfs(false, () => {}); };
      document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
      window.addEventListener('pagehide', save);
    }

    // Stop iOS from scrolling / zooming the page instead of the app.
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

    (async function () {
      const loading = document.getElementById('loading');
      const screen  = document.getElementById('screen');
      const status  = document.getElementById('status');
      try {
        window.simulide = await qtLoad({
          preRun: [mountStorage],
          qt: {
            onLoaded: () => { loading.style.display = 'none'; screen.style.display = 'block'; },
            onExit: d => {
              screen.style.display = 'none'; loading.style.display = 'flex';
              status.textContent = 'SimulIDE stopped' + (d.text ? ': ' + d.text : '') + '. Reload the page to restart.';
            },
            entryFunction: window.simulide_entry,
            containerElements: [screen],
          }
        });
      } catch (e) {
        console.error(e);
        status.textContent = 'Could not start: ' + e;
      }
    })();

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
